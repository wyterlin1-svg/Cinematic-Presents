<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lá em Casa Chopp</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #050303; --brass: #d9b77e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  #gl { position: absolute; left: -99999px; }
  #play {
    position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: var(--bg); color: var(--brass);
    font: 300 14px/1 'Jost', sans-serif; letter-spacing: .5em; text-transform: uppercase;
  }
  #play span { border-top: 1px solid #c8102e; padding-top: 18px; }
  body.render #play { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<div id="play"><span>assistir abertura</span></div>
<audio id="trilha" src="trilha.m4a" preload="auto"></audio>
<script type="module">
// ─────────────────────────────────────────────────────────────
//  Abertura cinemática — Lá em Casa Chopp
//  Cena 3D com renderização física (vidro, chopp, espuma, condensação),
//  tudo procedural. A tipografia e o acabamento de filme ficam num 2D por cima.
//  Parâmetros de URL: ?nome=Lá em Casa&sub=Chopp&rotulo=Ashby&w=1920&h=1080
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const NAME = (Q.get('nome') || 'Lá em Casa').toUpperCase();
const SUB = (Q.get('sub') || 'Chopp').toUpperCase();
const LABEL = (Q.get('rotulo') || 'Ashby').toUpperCase();
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const DUR = 24;
const S = Math.min(W, H) / 1080;
const CX = W / 2, CY = H / 2;
const RED = '#c8102e', CREAM = '#f3e9d8', BRASS = '#d9b77e';

// ── utilidades ──────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const win = (t, a, b, c, d) => eOut(seg(t, a, b)) * (1 - eIO(seg(t, c, d)));
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = (x, y) => {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// ── renderizador ────────────────────────────────────────────
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, .01, 20);

// ── ambiente de estúdio: duas réguas de luz laterais, um teto suave
//    e um brilho vermelho (a cor da casa) atrás da caneca ──────
scene.environment = (() => {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x030202, side: THREE.BackSide })));
  const panel = (w, h, hex, k, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(.5, 4.5, '#fff1e0', 6, [-3.2, .6, 1.2]);
  panel(.4, 4.5, '#fff1e0', 4, [3.2, .6, 1.6]);
  panel(3.5, 1.2, '#ffffff', 1.2, [0, 4.5, .5]);
  panel(1.6, 2.4, '#ff2a14', .9, [0, .4, -4.5]);
  panel(.8, .8, '#ffb15a', 1.6, [-.8, .2, -4.4]);
  const pm = new THREE.PMREMGenerator(renderer);
  return pm.fromScene(env, .015).texture;
})();

// ── fundo: penumbra com halo vermelho-âmbar atrás da caneca ──
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uGlow: { value: 0 }, uWarm: { value: 0 } },
  depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uGlow; uniform float uWarm;
    void main(){
      vec2 p = (vUv - vec2(.5,.42)) * vec2(1.6,1.);
      float d = length(p);
      vec3 red = vec3(.2,.008,.006), amber = vec3(.5,.2,.03);
      vec3 col = red * exp(-d*d*14.) * .55 + amber * exp(-d*d*60.) * uWarm * .35;
      col *= uGlow;
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(4, 2.6), bgMat);
bg.scale.set(1.6, 1.6, 1); bg.position.set(0, .3, -2.2);
scene.add(bg);

// ── bancada: pedra preta polida ─────────────────────────────
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6),
  new THREE.MeshPhysicalMaterial({ color: 0x030202, roughness: .55, clearcoat: .5, clearcoatRoughness: .12, transparent: true, opacity: .88, envMapIntensity: .35 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
scene.fog = new THREE.Fog(0x000000, .7, 1.7);

function radialTex(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// sombra de contato
const contact = new THREE.Mesh(new THREE.PlaneGeometry(.2, .2), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(0,0,0,.95)'], [.35, 'rgba(0,0,0,.6)'], [1, 'rgba(0,0,0,0)']]), transparent: true, depthWrite: false,
}));
contact.rotation.x = -Math.PI / 2; contact.position.y = .0004; scene.add(contact);
// cáustica: a luz atravessa o chopp e pinta a bancada de âmbar
const caustic = new THREE.Mesh(new THREE.PlaneGeometry(.22, .14), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(255,190,80,1)'], [.3, 'rgba(255,140,30,.55)'], [1, 'rgba(255,120,20,0)']]),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0,
}));
caustic.rotation.x = -Math.PI / 2; caustic.rotation.z = -.5; caustic.position.set(.06, .0006, .085); scene.add(caustic);

// ── luzes ───────────────────────────────────────────────────
const key = new THREE.SpotLight(0xfff0dc, 0, 4, .5, .8, 1.2);
key.position.set(-.7, .9, .8); key.target.position.set(0, .07, 0);
scene.add(key, key.target);
const rim = new THREE.SpotLight(0xff8a50, 0, 4, .6, .9, 1.2);
rim.position.set(.6, .5, -.7); rim.target.position.set(0, .08, 0);
scene.add(rim, rim.target);

// ── a caneca ────────────────────────────────────────────────
const R_IN = .039, H_MUG = .152, BASE = .017;
const rOut = y => .0445 + .0018 * (y / H_MUG);
const mug = new THREE.Group(); scene.add(mug);

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: .025, transmission: 1, thickness: .012, ior: 1.5,
  specularIntensity: 1, envMapIntensity: 1.25, side: THREE.DoubleSide,
  attenuationColor: new THREE.Color('#e9f3ec'), attenuationDistance: .4,
});
{
  const P = [], arc = (cx, cy, r, a0, a1, n = 6) => { for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); P.push(new THREE.Vector2(cx + Math.cos(a) * r, cy + Math.sin(a) * r)); } };
  P.push(new THREE.Vector2(0, 0));
  arc(rOut(0) - .005, .005, .005, -Math.PI / 2, 0);
  P.push(new THREE.Vector2(rOut(H_MUG - .003), H_MUG - .003));
  arc((rOut(H_MUG) + R_IN) / 2, H_MUG - .003, (rOut(H_MUG) - R_IN) / 2, 0, Math.PI, 8);
  P.push(new THREE.Vector2(R_IN, BASE + .004));
  arc(R_IN - .004, BASE + .004, .004, 0, -Math.PI / 2);
  P.push(new THREE.Vector2(0, BASE));
  mug.add(new THREE.Mesh(new THREE.LatheGeometry(P, 160), glassMat));
  // alça
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(rOut(.125) - .003, .126, 0), new THREE.Vector3(.068, .13, 0), new THREE.Vector3(.087, .112, 0),
    new THREE.Vector3(.09, .075, 0), new THREE.Vector3(.085, .045, 0), new THREE.Vector3(.066, .03, 0),
    new THREE.Vector3(rOut(.03) - .003, .03, 0),
  ]);
  mug.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 96, .0078, 28, false), glassMat));
}

// chopp: luz atravessando o líquido, mais intensa no centro, borbulhas subindo junto ao vidro
const beerVert = `
  varying vec3 vN; varying vec3 vV; varying vec3 vL; varying vec3 vW;
  void main(){
    vec4 wp = modelMatrix * vec4(position,1.);
    vW = wp.xyz; vL = position;
    vN = normalize(mat3(modelMatrix) * normal);
    vV = normalize(cameraPosition - wp.xyz);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const beerFrag = `
  uniform float uTime; uniform float uGlow; uniform float uBubbles; uniform float uLevel;
  uniform float uPour; uniform float uPourX; uniform float uSurf;
  varying vec3 vN; varying vec3 vV; varying vec3 vL; varying vec3 vW;
  float h1(float n){ return fract(sin(n*127.1)*43758.5453); }
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
  float fbm(vec2 p){ return n2(p)*.55 + n2(p*2.03+7.1)*.28 + n2(p*4.1+3.3)*.17; }
  void main(){
    float f = clamp(abs(dot(normalize(vN), normalize(vV))), 0., 1.);
    vec3 deep = vec3(.11,.02,.002), gold = vec3(.62,.21,.018), hot = vec3(.98,.52,.12);
    vec3 col = mix(deep, gold, pow(f, 1.6));
    col = mix(col, hot, pow(f, 9.) * .45);
    float hy = abs(vW.y);
    col *= mix(.55, 1.12, clamp((hy - .02) / max(uLevel, .02), 0., 1.));
    // ar arrastado pelo filete: uma pluma turva e agitada que desce do ponto de impacto
    if (uPour > 0.) {
      float dx = (vW.x - uPourX) / .01;
      float depth = clamp((uSurf - hy) / .075, 0., 1.);
      float tn = fbm(vec2(vW.x * 420. + sin(hy * 300. + uTime * 7.) * .8, hy * 260. + uTime * 9.));
      float plume = uPour * exp(-dx * dx * (1. + depth * 1.5)) * (1. - depth) * smoothstep(-.002, .004, uSurf - hy);
      col = mix(col, vec3(.85, .52, .2) * (.75 + .5 * tn), clamp(plume * (.2 + .45 * tn), 0., .45));
      // espuma nascendo junto à superfície
      float rim = smoothstep(.012, 0., uSurf - hy) * uPour;
      col = mix(col, vec3(.95, .82, .62) * (.8 + .3 * fbm(vec2(vW.x * 900., uTime * 3.))), rim * .3);
    }
    // borbulhas: colunas finas subindo pela parede
    if (abs(vN.y) < .5) {
      float ang = atan(vL.z, vL.x);
      float px = ang * .039, py = hy;
      float cw = .0022, ci = floor(px / cw), r0 = h1(ci);
      float on = step(.62, r0);
      float sp = .004 + .005 * h1(ci + 3.1);
      float yy = py - uTime * (.025 + .035 * h1(ci + 7.3));
      float cell = floor(yy / sp);
      vec2 c = vec2((ci + .5) * cw + (h1(cell + ci * 3.7) - .5) * cw * .45, (cell + .5) * sp);
      float r = .00016 + .00022 * h1(cell * 1.7 + ci);
      float d = length(vec2(px - c.x, yy - c.y));
      float ring = smoothstep(r, r * .55, d) - .65 * smoothstep(r * .55, r * .15, d);
      col += ring * on * uBubbles * vec3(1., .85, .55) * 1.1;
      // poeira fina de gás em suspensão
      float sx = floor(px / .0007), sy = floor((py - uTime * .02) / .0007);
      col += step(.996, h1(sx * 91.7 + sy * 17.3)) * uBubbles * vec3(1., .8, .45) * .35;
    }
    gl_FragColor = vec4(col * uGlow, 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;
const beerMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uGlow: { value: 1 }, uBubbles: { value: 0 }, uLevel: { value: .1 },
    uPour: { value: 0 }, uPourX: { value: -.011 }, uSurf: { value: 0 } },
  vertexShader: beerVert, fragmentShader: beerFrag, side: THREE.DoubleSide,
});
const beerGeo = new THREE.CylinderGeometry(R_IN - .0012, R_IN - .0012, 1, 128, 1);
beerGeo.translate(0, .5, 0);
const beer = new THREE.Mesh(beerGeo, beerMat);
mug.add(beer);

// espuma: colarinho cremoso, topo levemente abaulado e irregular
const foamTex = (() => {
  const n = 512, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, n, n);
  const R = rng(9);
  for (let i = 0; i < 2600; i++) {
    const x = R() * n, y = R() * n, r = 1 + Math.pow(R(), 3) * 9;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(.7, 'rgba(200,200,200,.4)'); gr.addColorStop(1, 'rgba(40,40,40,.6)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 1.5); return t;
})();
const foamMat = new THREE.MeshStandardMaterial({
  color: 0xf4ead6, roughness: .88, metalness: 0, bumpMap: foamTex, bumpScale: 1.2,
  emissive: new THREE.Color('#a8865a'), emissiveIntensity: .45, side: THREE.DoubleSide,
});
const foamGeo = (() => {
  const P = [], rf = R_IN - .0008;
  P.push(new THREE.Vector2(0, 0), new THREE.Vector2(rf, 0), new THREE.Vector2(rf, .82));
  for (let i = 1; i <= 10; i++) { const a = i / 10 * Math.PI / 2; P.push(new THREE.Vector2(rf * Math.cos(a), .82 + .24 * Math.sin(a))); }
  const g = new THREE.LatheGeometry(P, 128);
  const pos = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y > .8) {
      const n = Math.sin(v.x * 900) * Math.cos(v.z * 820) * .5 + Math.sin(v.x * 2300 + v.z * 1900) * .25;
      pos.setY(i, v.y + n * .05);
    }
  }
  g.computeVertexNormals();
  return g;
})();
const foam = new THREE.Mesh(foamGeo, foamMat);
mug.add(foam);

// filete de chopp caindo da torneira: afina ao acelerar, ondula, torce e reflete as réguas de luz
const POUR_X = -.011;
const streamNoise = `
  float h(float n){ return fract(sin(n)*43758.5453); }
  float n1(float x){ float i = floor(x), f = fract(x); f = f*f*(3.-2.*f); return mix(h(i), h(i+1.), f); }`;
const pourMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uX: { value: POUR_X }, uBot: { value: 0 } },
  vertexShader: `
    uniform float uTime; uniform float uX; uniform float uBot;
    varying vec3 vN; varying vec3 vV; varying vec3 vW; varying float vFlow; varying float vAng;
    ${streamNoise}
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.);
      vec2 rd = position.xz;                              // eixo local do filete
      float r = length(rd); vec2 dir = rd / max(r, 1e-6);
      float flow = wp.y + uTime * 1.6;                     // o padrão desce a ~1,6 m/s
      float bulge = (n1(flow * 38.) - .5) * .16 + (n1(flow * 110. + 3.) - .5) * .05;
      float fall = clamp((.75 - wp.y) / .7, 0., 1.);
      r *= (1. - .3 * fall) * (1. + bulge);                // afina enquanto acelera
      float tw = flow * 30.;                               // leve torção, como corda
      vec2 wob = vec2(sin(wp.y * 14. + uTime * 4.), cos(wp.y * 11. - uTime * 3.)) * .0005 * fall;
      wp.xz = vec2(uX, 0.) + dir * r + wob;
      vW = wp.xyz; vFlow = flow; vAng = atan(dir.y, dir.x) + tw * .15;
      vN = normalize(vec3(dir.x, -bulge * .4, dir.y));
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    varying vec3 vN; varying vec3 vV; varying vec3 vW; varying float vFlow; varying float vAng;
    ${streamNoise}
    void main(){
      vec3 N = normalize(vN), V = normalize(vV);
      float f = clamp(abs(dot(N, V)), 0., 1.);
      vec3 deep = vec3(.05,.008,0.), gold = vec3(.55,.14,.004), hot = vec3(1.,.38,.03);
      vec3 col = mix(deep, gold, smoothstep(0., .55, f));
      col = mix(col, hot, pow(f, 3.) * .8);
      // estrias de fluxo correndo para baixo
      float st = n1(vAng * 5. + 11.) * .6 + n1(vFlow * 45. + vAng * 3.) * .4;
      col *= .85 + .3 * st;
      // filetes de luz da régua principal, fixos na tela, como numa foto de estúdio
      vec3 Nv = normalize((viewMatrix * vec4(N, 0.)).xyz);
      float band = exp(-pow((Nv.x - .5) / .13, 2.)) * (.65 + .35 * n1(vFlow * 90.));
      float band2 = exp(-pow((Nv.x + .62) / .1, 2.)) * .5;
      col += (band * 3. + band2) * vec3(1., .94, .82);
      // reflexos das duas réguas de luz do estúdio
      vec3 Rf = reflect(-V, N);
      float s1 = pow(max(dot(Rf, normalize(vec3(-.9, .2, .45))), 0.), 70.);
      float s2 = pow(max(dot(Rf, normalize(vec3(.92, .2, .5))), 0.), 90.);
      float flick = .55 + .45 * n1(vFlow * 140. + vAng * 2.);
      col += (s1 * 2.2 + s2 * 1.4) * vec3(1., .96, .88) * flick;
      col += pow(1. - f, 3.) * vec3(.4, .2, .06);
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const pourGeo = new THREE.CylinderGeometry(.0042, .0042, 1, 40, 220, true);
pourGeo.translate(0, .5, 0);
const pour = new THREE.Mesh(pourGeo, pourMat);
scene.add(pour);

// respingos no impacto: gotinhas de chopp e de espuma que saltam e caem
const SPLASH = 46;
const splash = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8),
  new THREE.MeshStandardMaterial({ color: 0xd9a04a, roughness: .12, emissive: new THREE.Color('#4a2206'), emissiveIntensity: .6 }), SPLASH);
const splashData = (() => { const R = rng(77); return Array.from({ length: SPLASH }, () => ({
  per: .28 + R() * .35, ph: R(), vy: .22 + R() * .3, vh: .04 + R() * .11, a: R() * 6.283, r: .0005 + R() * .0011 })); })();
scene.add(splash);
const PZ = new THREE.Vector3(), PS = new THREE.Vector3(), PQ = new THREE.Quaternion(), PM = new THREE.Matrix4();
function updateSplash(t, active, surf) {
  splashData.forEach((d, i) => {
    const tau = ((t / d.per + d.ph) % 1) * d.per;
    let y = surf + d.vy * tau - 4.9 * tau * tau, r = d.r * (1 - tau / d.per * .5);
    const hr = d.vh * tau;
    if (!active || y < surf) r = 1e-6, y = surf;
    PZ.set(POUR_X + Math.cos(d.a) * hr, y, Math.sin(d.a) * hr);
    PS.set(r, r * 1.15, r);
    splash.setMatrixAt(i, PM.compose(PZ, PQ, PS));
  });
  splash.instanceMatrix.needsUpdate = true;
}

// condensação: gotas que se formam no vidro gelado
const dropData = (() => {
  const R = rng(31), out = [];
  for (let i = 0; i < 900; i++) {
    const y = .02 + Math.pow(R(), .8) * .11, a = R() * Math.PI * 2 - Math.PI, r = .0003 + Math.pow(R(), 3) * .0011, t0 = R();
    const onLabel = Math.abs(a) < .85 && Math.abs(y - .072) < .027;
    if (Math.abs(a - Math.PI / 2) > .2 && !onLabel) out.push({ y, a, r, t0 }); // livre na alça e no rótulo
  }
  return out;
})();
const drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .02, transmission: 1, thickness: .002, ior: 1.33, envMapIntensity: 1.6 }),
  dropData.length);
mug.add(drops);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function updateDrops(k) {
  dropData.forEach((d, i) => {
    const g = clamp((k - d.t0 * .6) / .4);
    const r = d.r * eOut(g) + 1e-6, ro = rOut(d.y) + r * .15;
    ps.set(Math.sin(d.a) * ro, d.y, Math.cos(d.a) * ro);
    q.setFromAxisAngle(UP, d.a);
    sc.set(r, r * 1.2, r * .3);
    drops.setMatrixAt(i, m4.compose(ps, q, sc));
  });
  drops.instanceMatrix.needsUpdate = true;
}
// névoa de vidro gelado
const frost = new THREE.Mesh(new THREE.CylinderGeometry(rOut(.15) + .0003, rOut(0) + .0003, .13, 128, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0, depthWrite: false,
    alphaMap: (() => { const t = foamTex.clone(); t.repeat.set(3, 2); t.needsUpdate = true; return t; })() }));
frost.position.y = .081; mug.add(frost);

// rótulo Ashby, aplicado no vidro
const labelCanvas = document.createElement('canvas'); labelCanvas.width = 1024; labelCanvas.height = 720;
const labelTex = new THREE.CanvasTexture(labelCanvas);
labelTex.colorSpace = THREE.SRGBColorSpace; labelTex.anisotropy = 8;
function paintLabel() {
  const w = labelCanvas.width, h = labelCanvas.height, g = labelCanvas.getContext('2d');
  const ex = w / 2, ey = h / 2, rx = w * .46, ry = h * .44;
  g.clearRect(0, 0, w, h);
  const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, '#4a0912'); gr.addColorStop(.4, '#7d1121'); gr.addColorStop(.6, '#7d1121'); gr.addColorStop(1, '#4a0912');
  g.fillStyle = gr; g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, 6.283); g.fill();
  g.strokeStyle = BRASS; g.lineWidth = 9; g.beginPath(); g.ellipse(ex, ey, rx - 6, ry - 6, 0, 0, 6.283); g.stroke();
  g.lineWidth = 3; g.globalAlpha = .7; g.beginPath(); g.ellipse(ex, ey, rx - 30, ry - 30, 0, 0, 6.283); g.stroke(); g.globalAlpha = 1;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = BRASS; g.font = `400 46px 'Jost'`; g.letterSpacing = '18px'; g.fillText('CERVEJA', ex + 9, ey - 150);
  g.fillStyle = CREAM; g.font = `500 200px 'Cormorant Garamond'`; g.letterSpacing = '20px'; g.fillText(LABEL, ex + 10, ey + 14);
  g.fillStyle = BRASS; g.fillRect(ex - 110, ey + 140, 220, 4);
  labelTex.needsUpdate = true;
}
const LBL_W = .066, LBL_H = .046, LBL_Y = .072;
const label = new THREE.Mesh(
  new THREE.CylinderGeometry(rOut(LBL_Y + LBL_H / 2) + .0004, rOut(LBL_Y - LBL_H / 2) + .0004, LBL_H, 64, 1, true,
    -LBL_W / rOut(LBL_Y) / 2, LBL_W / rOut(LBL_Y)),
  new THREE.MeshPhysicalMaterial({ map: labelTex, transparent: true, roughness: .35, clearcoat: 1, clearcoatRoughness: .1, alphaTest: .02 }));
label.position.y = LBL_Y; mug.add(label);

// reflexo na bancada (só o que brilha: chopp e espuma)
const mirror = new THREE.Group();
mirror.scale.y = -1; scene.add(mirror);
const beerR = new THREE.Mesh(beerGeo, beerMat), foamR = new THREE.Mesh(foamGeo, foamMat);
mirror.add(beerR, foamR);

// ── estado da cena por instante ─────────────────────────────
const FULL = .78 * (H_MUG - BASE), FOAM_MAX = .2 * (H_MUG - BASE);
function setLiquid(t) {
  const fill = eOut(seg(t, 5.8, 11.4));
  const level = Math.max(.0004, fill * FULL);
  const fh = Math.max(.0004, eOut(seg(t, 7.2, 12.2)) * FOAM_MAX * (1 - .12 * seg(t, 12.2, 20)));
  const show = fill > .002;
  for (const [b, f] of [[beer, foam], [beerR, foamR]]) {
    b.visible = f.visible = show;
    b.scale.y = level; b.position.y = BASE;
    f.position.y = BASE + level - .0006;
    f.scale.set(1, fh / 1.06, 1);
  }
  beerMat.uniforms.uTime.value = t;
  beerMat.uniforms.uLevel.value = level + BASE;
  beerMat.uniforms.uBubbles.value = seg(t, 6.5, 8);
  beerMat.uniforms.uGlow.value = .85 + .2 * seg(t, 8, 12);

  // filete
  const on = seg(t, 5.6, 5.95), off = eIn(seg(t, 11.0, 11.6));
  const surf = BASE + level + fh * .55;
  const top = lerp(.75, surf, off), bot = lerp(.75, surf, on);
  pour.visible = on > 0 && off < 1 && top - bot > .001;
  pour.position.y = bot; pour.scale.y = Math.max(.001, top - bot);
  pourMat.uniforms.uTime.value = t;
  const pouring = on * (1 - off);
  beerMat.uniforms.uPour.value = pouring * (1 - .5 * seg(t, 9, 11)) + .25 * seg(t, 11, 11.6) * (1 - seg(t, 11.6, 13));
  beerMat.uniforms.uPourX.value = POUR_X;
  beerMat.uniforms.uSurf.value = BASE + level;
  updateSplash(t, pouring > .5 && on >= 1, surf);
  // espuma viva enquanto o chopp entra, assentando depois
  foamTex.offset.set(t * .015 * (pouring + .15), -t * .04 * pouring);
  foam.rotation.y = foamR.rotation.y = Math.sin(t * .9) * .05 * pouring;

  // gelo: condensação e névoa
  const cold = seg(t, 9.5, 15);
  updateDrops(cold);
  frost.material.opacity = cold * .09;
  glassMat.roughness = .025 + cold * .02;
  caustic.material.opacity = fill * .4;
  mirror.visible = show;
}

// ── câmera: trilho em Catmull-Rom ───────────────────────────
// [tempo, distância, azimute, altura da câmera, altura do alvo, fov]
const KEYS = [
  [0.0, .20, -.75, .158, .135, 26],
  [2.6, .30, -.55, .13, .11, 27],
  [5.6, .52, -.30, .135, .12, 28],
  [11.4, .47, .02, .10, .09, 28],
  [14.6, .27, .04, .08, .075, 28],
  [16.0, .17, .55, .055, .06, 30],
  [18.2, .19, .75, .06, .065, 30],
  [20.0, .66, .20, .15, .16, 28],
  [24.0, .70, .26, .155, .165, 28],
];
function cr(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return .5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const k0 = KEYS[Math.max(0, i - 1)], k1 = KEYS[i], k2 = KEYS[i + 1], k3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const u = clamp((t - k1[0]) / (k2[0] - k1[0]));
  const [d, az, cy, ty, fov] = [1, 2, 3, 4, 5].map(j => cr(k0[j], k1[j], k2[j], k3[j], u));
  camera.position.set(Math.sin(az) * d, cy, Math.cos(az) * d);
  camera.lookAt(0, ty, 0);
  camera.fov = W / H < 1 ? fov * 1.75 : fov;
  camera.updateProjectionMatrix();
}

// ── 2D por cima: tipografia, grão e vinheta ─────────────────
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const grain = (() => {
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), img = g.createImageData(n, n), R = rng(3);
  for (let i = 0; i < n * n * 4; i += 4) { const v = R() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return ctx.createPattern(c, 'repeat');
})();

function spaced(text, x, y, font, spacing, color, alpha = 1, perLetter, c = ctx) {
  c.save(); c.font = font; c.fillStyle = color; c.textBaseline = 'middle';
  const chars = [...text], ws = chars.map(ch => c.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + spacing * (ws.length - 1);
  let px = x - total / 2;
  chars.forEach((ch, i) => {
    const pl = perLetter ? perLetter(i, chars.length) : { a: 1, dy: 0 };
    c.globalAlpha = alpha * pl.a; c.fillText(ch, px, y + (pl.dy || 0)); px += ws[i] + spacing;
  });
  c.restore(); return total;
}
function redThread(x, y, half, alpha) {
  if (alpha <= 0 || half <= 0) return;
  ctx.save();
  const g = ctx.createLinearGradient(x - half, 0, x + half, 0);
  g.addColorStop(0, 'rgba(200,16,46,0)'); g.addColorStop(.2, RED); g.addColorStop(.8, RED); g.addColorStop(1, 'rgba(200,16,46,0)');
  ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,60,40,.9)'; ctx.shadowBlur = 12 * S;
  ctx.fillRect(x - half, y - 1.1 * S, half * 2, 2.2 * S);
  ctx.restore();
}

const nameCanvas = document.createElement('canvas'); nameCanvas.width = W; nameCanvas.height = H;
const nctx = nameCanvas.getContext('2d');
const LOGO_Y = W / H < 1 ? H * .3 : H * .36;

function drawLogo(t) {
  const ringY = LOGO_Y - 190 * S, ringR = 74 * S;
  const ring = eIO(seg(t, 19.0, 20.5));
  if (ring > 0) {
    ctx.save(); ctx.strokeStyle = BRASS; ctx.lineWidth = 1.5 * S; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.arc(CX, ringY, ringR, -Math.PI / 2, -Math.PI / 2 + ring * Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = .45 * ring; ctx.beginPath(); ctx.arc(CX, ringY, ringR - 7 * S, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // monograma: a casa, em traço contínuo
  const hk = eIO(seg(t, 19.6, 21));
  if (hk > 0) {
    const s = 33 * S, by = ringY + s * .98, house = new Path2D();
    house.moveTo(CX - .32 * s, by); house.lineTo(CX - s, by); house.lineTo(CX - s, by - 1.05 * s);
    house.lineTo(CX, by - 1.9 * s); house.lineTo(CX + s, by - 1.05 * s); house.lineTo(CX + s, by);
    house.lineTo(CX + .32 * s, by); house.lineTo(CX + .32 * s, by - .5 * s);
    house.arc(CX, by - .5 * s, .32 * s, 0, Math.PI, true); house.lineTo(CX - .32 * s, by);
    ctx.save(); ctx.strokeStyle = CREAM; ctx.lineWidth = 2 * S; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,214,150,.5)'; ctx.shadowBlur = 6 * S;
    const hl = 8.5 * s; ctx.setLineDash([hl * hk, hl]); ctx.stroke(house); ctx.restore();
  }
  // nome — letra a letra, com o espaçamento se assentando
  const nk = seg(t, 19.5, 21.7);
  let subW = 0;
  if (nk > 0) {
    nctx.clearRect(0, 0, W, H); nctx.save();
    nctx.textBaseline = 'middle'; nctx.fillStyle = CREAM;
    nctx.shadowColor = 'rgba(0,0,0,.6)'; nctx.shadowBlur = 18 * S;
    let fs = 104 * S, sp = lerp(46, 28, eOut(nk)) * S;
    nctx.font = `500 ${fs}px 'Cormorant Garamond'`;
    const chars = [...NAME];
    let ws = chars.map(ch => nctx.measureText(ch).width);
    let total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    const fit = Math.min(1, W * .86 / total);
    if (fit < 1) { fs *= fit; sp *= fit; ws = ws.map(w => w * fit); total *= fit; nctx.font = `500 ${fs}px 'Cormorant Garamond'`; }
    let px = CX - total / 2;
    chars.forEach((ch, i) => {
      const li = eOut(clamp((nk * (chars.length + 4) - i) / 5));
      nctx.globalAlpha = li; nctx.fillText(ch, px, LOGO_Y - 6 * S + (1 - li) * 18 * S); px += ws[i] + sp;
    });
    const ck = eOut(seg(t, 20.6, 21.8));
    subW = spaced(SUB, CX, LOGO_Y + 78 * S, `400 ${34 * S}px 'Jost'`, lerp(30, 22, ck) * S, BRASS, ck, null, nctx);
    // brilho que atravessa o nome
    const sh = seg(t, 22.0, 23.2);
    if (sh > 0 && sh < 1) {
      nctx.shadowBlur = 0; nctx.globalCompositeOperation = 'source-atop'; nctx.globalAlpha = 1;
      const sx = lerp(CX - total, CX + total, eIO(sh));
      const g = nctx.createLinearGradient(sx - 120 * S, 0, sx + 120 * S, 0);
      g.addColorStop(0, 'rgba(255,214,150,0)'); g.addColorStop(.5, 'rgba(255,214,150,1)'); g.addColorStop(1, 'rgba(255,214,150,0)');
      nctx.fillStyle = g; nctx.fillRect(0, 0, W, H);
    }
    nctx.restore(); ctx.drawImage(nameCanvas, 0, 0);
  }
  // fios vermelhos ladeando o CHOPP
  const th = eIO(seg(t, 20.9, 22.1));
  const half = 80 * S * th, off = subW / 2 + 34 * S + 80 * S;
  redThread(CX - off, LOGO_Y + 78 * S, half, th);
  redThread(CX + off, LOGO_Y + 78 * S, half, th);
}

// "momento" em partículas: sobem como bolhas, formam a palavra e se desfazem como gás
const DOT = (() => {
  const r = 16, c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, 'rgba(255,250,235,1)'); gr.addColorStop(.25, 'rgba(255,214,150,.75)');
  gr.addColorStop(.6, 'rgba(240,160,70,.18)'); gr.addColorStop(1, 'rgba(240,160,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); return c;
})();
let particles = [], textLayer = null;
function buildParticles(text) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff7e8';
  g.font = `italic 300 ${150 * S}px 'Cormorant Garamond'`; g.letterSpacing = `${6 * S}px`;
  g.fillText(text, CX, CY);
  textLayer = c;
  const data = g.getImageData(0, 0, W, H).data, step = Math.max(2, Math.round(2.4 * S)), R = rng(55);
  let minX = W, maxX = 0;
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    if (data[(y * W + x) * 4 + 3] > 120) { particles.push({ tx: x, ty: y }); minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
  }
  particles.forEach(p => Object.assign(p, {
    sx: p.tx + (R() - .5) * 520 * S, sy: p.ty + (180 + R() * 520) * S,
    d: (p.tx - minX) / (maxX - minX + 1) * .65 + R() * .3,
    sw: (R() - .5) * 2, s: .6 + Math.pow(R(), 2) * 1.4, ph: R() * 6.283,
    vx: (R() - .5) * 90 * S, vy: -(120 + R() * 260) * S,
  }));
}
function drawMomento(t, a = 15.2, b = 18.6) {
  if (t < a || t > b + .2 || !particles.length) return;
  const assembled = eOut(seg(t, a + .9, a + 2.2)), gone = seg(t, b - 1.3, b);
  // penumbra para a palavra respirar sobre as bolhas
  const dg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 460 * S);
  dg.addColorStop(0, `rgba(20,8,2,${.45 * win(t, a, a + .8, b - .6, b)})`); dg.addColorStop(1, 'rgba(20,8,2,0)');
  ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
  // a palavra nítida surge por baixo das partículas e se dissolve com elas
  ctx.save(); ctx.globalAlpha = assembled * (1 - eOut(gone)) * .7;
  ctx.shadowColor = 'rgba(255,190,110,.6)'; ctx.shadowBlur = 18 * S; ctx.drawImage(textLayer, 0, 0); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const k = clamp((t - a - p.d) / 1.35);
    if (k <= 0) continue;
    const e = eOut(k);
    let x = lerp(p.sx, p.tx, e) + Math.sin(k * Math.PI * 2 + p.ph) * (1 - e) * 26 * S * p.sw;
    let y = lerp(p.sy, p.ty, e);
    const q = eIn(clamp((t - (b - 1.4) - p.d * .45) / .95));
    x += p.vx * q + Math.sin(t * 3 + p.ph) * 6 * S * q; y += p.vy * q;
    const tw = .7 + .3 * Math.sin(t * 9 + p.ph);
    const al = clamp(k * 3) * (1 - q) * tw * (1 - .55 * e * (1 - q) * assembled);
    if (al < .02) continue;
    const r = (2.8 + p.s * 2.6 * (1 - e * .45)) * S;
    ctx.globalAlpha = al; ctx.drawImage(DOT, x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

// ── quadro ──────────────────────────────────────────────────
function render(t) {
  // luz: o estúdio acende devagar
  const ign = eIO(seg(t, .2, 3.2));
  renderer.toneMappingExposure = lerp(.05, .95, ign);
  scene.environmentIntensity = lerp(.2, 1, ign);
  scene.environmentRotation.y = lerp(-.9, .15, eOut(seg(t, 0, 6))) + Math.sin(t * .2) * .05;
  bgMat.uniforms.uGlow.value = eOut(seg(t, .5, 4));
  bgMat.uniforms.uWarm.value = seg(t, 7, 12);
  key.intensity = 10 * ign; rim.intensity = 3.5 * ign;

  setLiquid(t);
  camAt(t);
  renderer.render(scene, camera);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.drawImage(glCanvas, 0, 0);

  drawMomento(t);

  // assinatura: a cena recua para a penumbra e o nome aparece
  if (t > 18.6) {
    const d = eIO(seg(t, 18.6, 20.2));
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgba(0,0,0,${.75 * d})`); g.addColorStop(.55, `rgba(0,0,0,${.45 * d})`); g.addColorStop(1, `rgba(0,0,0,${.15 * d})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    drawLogo(t);
  }

  // acabamento: vinheta + grão de filme + fade
  const vg = ctx.createRadialGradient(CX, CY, Math.min(W, H) * .35, CX, CY, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .05;
  const f = Math.floor(t * 30);
  ctx.translate((hash(f, 1) * 256) | 0, (hash(f, 2) * 256) | 0);
  ctx.fillStyle = grain; ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();
  const fade = Math.max(1 - seg(t, 0, .6), seg(t, 23.2, 24));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ── execução ────────────────────────────────────────────────
window.DUR = DUR;
window.render = render;
window.ready = Promise.all([
  document.fonts.load(`500 40px 'Cormorant Garamond'`), document.fonts.load(`italic 300 40px 'Cormorant Garamond'`),
  document.fonts.load(`300 40px 'Jost'`), document.fonts.load(`400 40px 'Jost'`),
]).then(() => document.fonts.ready).then(() => { paintLabel(); buildParticles('momento'); renderer.compile(scene, camera); });

if (Q.has('render')) {
  document.body.classList.add('render');
} else {
  const audio = document.getElementById('trilha');
  let t0 = null;
  window.ready.then(() => render(0));
  const loop = now => {
    const t = audio.currentTime > 0 && !audio.paused ? audio.currentTime : (now - t0) / 1000;
    render(Math.min(t, DUR));
    if (t < DUR) requestAnimationFrame(loop);
    else document.getElementById('play').style.display = '';
  };
  document.getElementById('play').addEventListener('click', e => {
    e.currentTarget.style.display = 'none';
    audio.currentTime = 0; audio.play().catch(() => {});
    t0 = performance.now(); requestAnimationFrame(loop);
  });
}
</script>
